[project]
name = "neuro-audio"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "DorsaRoh", email = "dorsa.rohani@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0.0",
    "brainflow>=5.22.2",
    "diffusers>=0.32.0",
    "numpy>=2.4.6",
    "protobuf>=5.0.0",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=2.4.0",
    "torchsde>=0.2.6",
    "transformers>=4.46.0",
]

[project.scripts]
neuro-audio = "neuro_audio:main"
play-prompts = "neuro_audio.play_prompts:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
